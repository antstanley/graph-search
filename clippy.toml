# Clippy configuration for the graph-search workspace, mirroring nanus: the
# panic-family lints are denied in production and permitted where a panic *is*
# the test mechanism.

allow-panic-in-tests = true
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = false

too-many-arguments-threshold = 6
type-complexity-threshold = 200
