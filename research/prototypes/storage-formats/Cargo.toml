# Research prototype: measures serialisation formats and storage engines for the
# generation artifacts on a real index. Standalone (own `[workspace]`), so none of
# these dependencies reach the product crates.
[package]
name = "storage-formats-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
graph-search-types = { path = "../../../crates/types" }
graph-search-core = { path = "../../../crates/core" }
graph-search-engine = { path = "../../../crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Self-describing binary: tolerates `skip_serializing_if`/`untagged`.
rmp-serde = "1"
# Positional binary: expected NOT to round-trip the current types (measured).
postcard = { version = "1", features = ["use-std"] }
bincode = { version = "2", features = ["serde"] }
# Zero-copy archive, on a mirror type (the product types have no derives).
rkyv = "0.8"
# Compression.
zstd = "0.13"
lz4_flex = "0.11"
# Hashing.
sha2 = "0.10"
sha2_011 = { package = "sha2", version = "0.11" }
blake3 = "1"
# Storage engines.
rusqlite = { version = "0.37", features = ["bundled"] }
redb = "2"

[profile.release]
lto = "thin"
codegen-units = 1
