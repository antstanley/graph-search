name: Task evaluation harness
on:
  pull_request:
    paths:
      - 'evaluation/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/task-evaluation.yml'
  push:
    branches: [main]
    paths:
      - 'evaluation/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/task-evaluation.yml'
jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: PYTHONPATH=evaluation python3 -m unittest discover -s evaluation/tests -v
      - run: cargo build --locked --manifest-path evaluation/harness/Cargo.toml
      - run: cargo fmt --manifest-path evaluation/harness/Cargo.toml --check
